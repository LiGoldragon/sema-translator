[package]
name = "sema-translator"
version = "0.11.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/sema-translator"
description = "Authority-approved bootstrap translator for strict Ethos assembly"
publish = false
autotests = false

[lib]
name = "sema_translator"
path = "src/lib.rs"

[features]
default = ["bootstrap"]
bootstrap = [
  "dep:core-ethos",
  "dep:name-table",
  "dep:structural-codec",
  "dep:content-identity",
  "dep:getrandom",
  "dep:thiserror",
]

[dependencies]
core-ethos = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "9fb2ba6f4afe", optional = true }
name-table = { git = "https://github.com/LiGoldragon/name-table.git", rev = "7dd5db15c16b4246c83d049c759415d3252a7d43", optional = true }
structural-codec = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "fd3b3bebfe69", optional = true }
content-identity = { git = "https://github.com/LiGoldragon/content-identity.git", rev = "df1d25c7cd9e822ae03255e04ede59a00b78480b", optional = true }
getrandom = { version = "0.3", optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "dependency_boundary"
path = "tests/dependency_boundary.rs"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
