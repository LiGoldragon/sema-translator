[package]
name = "sema-translator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/sema-translator"
description = "Sole-writer nested naming authority for encodedID chains"
publish = false

[lib]
name = "sema_translator"
path = "src/lib.rs"

[[bin]]
name = "sema-translator-daemon"
path = "src/bin/sema-translator-daemon.rs"

[dependencies]
blake3 = "1"
name-table = { git = "https://github.com/LiGoldragon/name-table.git", rev = "c3a4b472caa6d225bb9eb09b1893942cdb5fec9e" }
rkyv = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sema-engine = { git = "https://github.com/LiGoldragon/sema-engine.git", rev = "94d2f7ee7b81d0bf3b6f1a111f6bbbc398c0e7a3" }
signal-frame = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "0786fbe8caf27552afcdd5deb85bc82ec6088337", default-features = false }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "5df821a335bdbd28582f71d4f25d4bd31deee567" }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
