[package]
name = "sema-translator"
version = "0.11.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/sema-translator"
description = "Authority-approved bootstrap translator for strict Ethos assembly"
publish = false
autotests = false

[lib]
name = "sema_translator"
path = "src/lib.rs"

[features]
default = ["bootstrap"]
bootstrap = [
  "dep:core-ethos",
  "dep:name-table",
  "dep:signal-sema-translator",
  "dep:structural-codec",
  "dep:thiserror",
]

[dependencies]
core-ethos = { git = "https://github.com/LiGoldragon/core-ethos.git", rev = "e6827c47ef254a4061a9d1a16b4b780673dc5d83", optional = true }
name-table = { git = "https://github.com/LiGoldragon/name-table.git", rev = "a22f48d8040ab9235f3552ad8654ff8e27b8157d", optional = true }
signal-sema-translator = { git = "https://github.com/LiGoldragon/signal-sema-translator.git", rev = "3f41813dd63904c7e2b3da4382eff64ed1bf12fe", optional = true }
structural-codec = { git = "https://github.com/LiGoldragon/structural-codec.git", rev = "70ef879bc99eb247b7661169794ee189d45c62ff", optional = true }
thiserror = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[[test]]
name = "dependency_boundary"
path = "tests/dependency_boundary.rs"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
